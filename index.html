<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业展示页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            /* 粉色渐变背景 */
            background: linear-gradient(#ffc8dd, #ffafcc);
            background-size: cover;
            position: relative;
            overflow-x: hidden;
        }
        /* Hello Kitty 装饰 */
        .kitty {
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 150px;
            z-index: 9;
        }
        .student-id {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }
        .center-box {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 30px 40px;
            text-align: center;
        }
        .card h2 {
            color: #ffdd44;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .card a {
            display: block;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            margin: 18px 0;
            transition: all 0.3s ease;
        }
        .card a:hover {
            color: #ffdd44;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Hello Kitty 图片 -->
    <img class="kitty" src="https://img.icons8.com/fluency/400/hello-kitty.png">

    <div class="student-id">学号:25051030312</div>

    <div class="center-box">
        <div class="card">
            <h2>课程作业列表</h2>
            <li><a href="/pyy.html">- HTML基础1</a ></li>
                <li><a href="潘悦.html">第二章课后习题</a ></li>
            <a href="5-18作业.html">第三章课后习题</a >
            <a href="6-2作业.html">第四章课后作业.</a >
                <a href="6-12.html">第五章课后作业.</a >
        </div>
    </div>
</body>
</html>
